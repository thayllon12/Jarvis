name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extrair projeto do zip
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum arquivo .zip encontrado na raiz do repositorio."
            exit 1
          fi
          echo "Extraindo $ZIP"
          unzip -q "$ZIP" -d extraido

      - name: Localizar projeto DEVAI
        run: |
          CONFIG=$(find extraido -name capacitor.config.json -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$CONFIG" ]; then
            echo "ERRO: capacitor.config.json nao encontrado dentro do zip."
            exit 1
          fi
          APP_DIR=$(dirname "$CONFIG")
          echo "APP_DIR=$GITHUB_WORKSPACE/$APP_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $APP_DIR"

      - name: Instalar dependencias
        run: |
          cd "$APP_DIR"
          npm install

      - name: Gerar build web
        run: |
          cd "$APP_DIR"
          npm run build

      - name: Criar projeto Android
        run: |
          cd "$APP_DIR"
          npx cap add android

      - name: Sincronizar com Android
        run: |
          cd "$APP_DIR"
          npx cap sync android

      - name: Permitir HTTP local (localhost do Termux)
        run: |
          cd "$APP_DIR"
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Compilar APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copiar APK
        run: cp "$APP_DIR/android/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/devai-chat.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: devai-chat-apk
          path: devai-chat.apk
